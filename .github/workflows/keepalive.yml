name: Keepalive

# Free Supabase projects pause after a week without activity, which would take every card and
# QR offline. One tiny public read a week keeps it awake. Check Supabase's current terms
# before relying on this (ARCHITECTURE §9).
#
# Setup: repository Settings → Secrets and variables → Actions → add
#   SUPABASE_URL       (same value as VITE_SUPABASE_URL)
#   SUPABASE_ANON_KEY  (same value as VITE_SUPABASE_ANON_KEY; public, never the service-role key)

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC (11:17 PHT)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read one public card
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Fail loudly: a skipped ping that shows green would let the project pause unnoticed.
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets (see the comment at the top of this file). Without them the project can pause."
            exit 1
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/published_cards?select=username&limit=1")
          echo "HTTP $code"
          test "$code" = "200"
